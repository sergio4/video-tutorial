<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ciuffo, test animazione</title>
<style>
  body{margin:0;background:#111;color:#ddd;font:14px system-ui}
  #stage svg{display:block;width:100%;max-width:1920px;height:auto}
  #bar{padding:8px}
</style>
</head>
<body>
<div id="bar"><button id="play">Play</button> <span id="tc"></span></div>
<div id="stage"></div>
<script type="module">
import { ciuffo, shadow, paperBG, C } from './ciuffo.js';
import { saveSVG, wrap } from './export.js';

const W = 1920, H = 1080, FPS = 25, DUR = 6.4, GROUND = 960, SC = 0.8;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const on2 = t => Math.floor(t * FPS / 2) * 2 / FPS; // personaggio a 12,5 pose al secondo

function walkPose(t) {
  const ph = 2 * Math.PI * 1.25 * t, s = Math.sin(ph), c = Math.cos(ph);
  return {
    view: 'side', lean: 5, expr: t > 1.1 && t < 1.2 ? 'blink' : 'neutro',
    legA: [-26 * s, -40 * Math.max(0, -c)], legB: [26 * s, -40 * Math.max(0, c)],
    armA: [24 * s, 18], armB: [-24 * s, 18], hair: -6 - 5 * Math.sin(2 * ph),
    x: -250 + 1210 * clamp(t / 2.4, 0, 1),
  };
}

function pose(t) {
  const x = 960;
  if (t < 2.4) return walkPose(t);
  if (t < 2.56) return { view: 'q', x, expr: 'neutro', hair: 4 };
  if (t < 3.2) return { view: 'front', x, expr: 'incuriosito', tilt: t < 2.8 ? 0 : 5, hair: -2 };
  if (t < 3.52) { // rincorsa
    const u = ease((t - 3.2) / 0.32);
    return { view: 'front', x, expr: 'determinato', squash: 1 - 0.1 * u,
      legA: [-4 - 12 * u, 28 * u], legB: [4 + 12 * u, -28 * u], armA: [-8 - 30 * u, -4], armB: [8 + 30 * u, 4], hair: -4 * u };
  }
  if (t < 4.32) { // salto
    const u = (t - 3.52) / 0.8;
    return { view: 'front', x, expr: 'esultanza', planted: false, lift: 250 * Math.sin(Math.PI * u),
      squash: u < 0.4 ? 1.06 : 1, legA: [-28, 10], legB: [28, -10], armA: [-150, -10], armB: [150, 10],
      hair: 14 * Math.cos(Math.PI * u) };
  }
  if (t < 4.56) { // atterraggio
    const u = (t - 4.32) / 0.24;
    return { view: 'front', x, expr: 'sorpreso', squash: 0.82 + 0.12 * u,
      legA: [-18 + 8 * u, 34 - 16 * u], legB: [18 - 8 * u, -34 + 16 * u], armA: [-60, -20], armB: [60, 20], hair: -10 };
  }
  if (t < 5.2) return { view: 'front', x, expr: 'esultanza', armA: [-30, 150], armB: [165, -12], handA: 'fist', handB: 'fist',
    legA: [-9, 0], legB: [9, 0], tilt: -4, hair: 5 * Math.sin(t * 20) };
  return { view: 'front', x, expr: t < 5.5 ? 'sorriso' : 'furbo', tilt: 6, armA: [-10, -6], armB: [40, -75], handB: 'fist', hair: 2 };
}

function world(t) {
  // strappo diagonale verso il mondo «dentro», durante il salto
  const u = clamp((t - 3.7) / 0.45, 0, 1);
  if (u <= 0) return { bg: paperBG(W, H, GROUND), dark: false };
  const e = -500 + ease(u) * 3400;
  const violet = `<defs><radialGradient id="vg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#4A2A8A"/><stop offset="0.6" stop-color="#311A60"/><stop offset="1" stop-color="#1C0F3A"/></radialGradient></defs>` +
    `<rect width="${W}" height="${H}" fill="url(#vg)"/>` +
    `<path d="M-100 ${H * 0.9} L${W + 100} ${H * 0.05}" stroke="${C.cyan}" stroke-width="3" opacity="0.45"/>` +
    `<path d="M300 ${H + 50} L${W + 200} ${H * 0.35}" stroke="${C.pink}" stroke-width="3" opacity="0.45"/>` +
    [[260, 220, 60], [1650, 300, 90], [1420, 820, 50], [420, 760, 70]].map(([cx, cy, r]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.pink}" opacity="0.08"/>`).join('') +
    `<path d="M0 ${GROUND} L${W} ${GROUND}" stroke="${C.cyan}" stroke-width="3" opacity="0.6"/>`;
  if (u >= 1) return { bg: violet, dark: true };
  const clip = `<clipPath id="wipe"><path d="M-800 0 L${e} 0 L${e - 700} ${H} L-800 ${H} Z"/></clipPath>`;
  const edge = `<path d="M${e} 0 L${e - 700} ${H}" stroke="${C.cyan}" stroke-width="8" opacity="0.9"/>`;
  return { bg: paperBG(W, H, GROUND) + `<defs>${clip}</defs><g clip-path="url(#wipe)">${violet}</g>` + edge, dark: u > 0.5 };
}

function frame(t) {
  const tp = on2(t);
  const p = pose(tp);
  const w = world(t);
  const glow = `<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="${C.cyan}" flood-opacity="0.9"/><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="${C.pink}" flood-opacity="0.45"/></filter></defs>`;
  const ch = ciuffo({ ...p, y: GROUND, scale: SC });
  return wrap(W, H, w.bg + glow + shadow(p.x, GROUND, p.lift || 0, SC) + (w.dark ? `<g filter="url(#glow)">${ch}</g>` : ch));
}

const stage = document.getElementById('stage'), tc = document.getElementById('tc');
let t0 = null;
function loop(ts) {
  if (t0 === null) t0 = ts;
  const t = ((ts - t0) / 1000) % DUR;
  stage.innerHTML = frame(t); tc.textContent = t.toFixed(2) + ' s';
  requestAnimationFrame(loop);
}
stage.innerHTML = frame(0);
document.getElementById('play').onclick = () => requestAnimationFrame(loop);

window.__N = Math.round(DUR * FPS);
window.__exportRange = async (a, b) => {
  for (let i = a; i < Math.min(b, window.__N); i++)
    await saveSVG(frame(i / FPS), `anim/f${String(i).padStart(4, '0')}.png`, W, H);
  return 'ok ' + a + '-' + b;
};
window.__still = async (t, name) => { await saveSVG(frame(t), `anim/${name}.png`, W, H); return 'ok'; };
</script>
</body>
</html>
