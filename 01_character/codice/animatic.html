<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>«Tocca a te», animatic v3</title>
<style>
  body{margin:0;background:#111;color:#ddd;font:14px system-ui;display:flex;flex-direction:column;align-items:center}
  #bar{padding:8px;display:flex;gap:10px;align-items:center;width:min(100%,560px)}
  #scrub{flex:1}
  #stage svg{display:block;max-width:100vw;max-height:calc(100vh - 56px);width:auto;height:auto}
</style>
</head>
<body>
<div id="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" step="0.04" value="0"><span id="tc">0.00 s</span></div>
<div id="stage"></div>
<audio id="audio" src="audio/mix.wav" preload="auto"></audio>
<script type="module">
// ?tc=1 aggiunge il timecode in alto a destra. L'anteprima suona audio/mix.wav in sincrono.
import { frame, W, H, FPS, duration } from './animatic.js';
import { expose } from './export.js';
import { loadAssets } from './assets.js';

await loadAssets(); // timeline, loghi, tessera, font e carta vanno caricati prima del primo fotogramma
const tc = new URLSearchParams(location.search).get('tc') === '1';
const DUR = duration();
const draw = t => frame(t, { tc });
expose({ W, H, FPS, N: Math.round(DUR * FPS), frame: draw });

const stage = document.getElementById('stage'), label = document.getElementById('tc'), scrub = document.getElementById('scrub'), audio = document.getElementById('audio');
scrub.max = DUR;
const show = t => { stage.innerHTML = draw(t); label.textContent = t.toFixed(2) + ' s'; scrub.value = t; };
let playing = false;
function loop() {
  if (!playing) return;
  show(audio.currentTime);
  if (audio.ended) { playing = false; document.getElementById('play').textContent = 'Play'; return; }
  requestAnimationFrame(loop);
}
document.getElementById('play').onclick = e => {
  playing = !playing;
  e.target.textContent = playing ? 'Pausa' : 'Play';
  if (playing) { audio.currentTime = +scrub.value; audio.play(); requestAnimationFrame(loop); } else audio.pause();
};
scrub.oninput = () => { playing = false; audio.pause(); document.getElementById('play').textContent = 'Play'; show(+scrub.value); };
show(0);
</script>
</body>
</html>
