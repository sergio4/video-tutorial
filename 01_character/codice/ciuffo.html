<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ciuffo, prova in codice</title>
<style>
  html,body{margin:0;background:#F3EDE2;}
  .stage{display:flex;gap:0;width:1600px;height:900px;}
  .half{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .fuori{background:#F3EDE2;
    background-image:radial-gradient(rgba(43,34,51,.06) 1px,transparent 1px);background-size:5px 5px;}
  .dentro{background:radial-gradient(circle at 50% 40%,#4A2A8A 0%,#311A60 55%,#1C0F3A 100%);}
  .dentro::before,.dentro::after{content:"";position:absolute;width:140%;height:3px;left:-20%;
    background:linear-gradient(90deg,transparent,#00FFFF,transparent);transform:rotate(-24deg);top:30%;opacity:.55;filter:blur(1px)}
  .dentro::after{background:linear-gradient(90deg,transparent,#F608BE,transparent);top:72%;opacity:.5}
  svg{height:860px;overflow:visible}
  .dentro svg{filter:drop-shadow(0 0 2px #00FFFF) drop-shadow(0 0 10px rgba(246,8,190,.45))}

  /* animazione: respiro, ciuffo che ondeggia, battito di ciglia */
  .body{animation:breathe 2.4s ease-in-out infinite;transform-origin:200px 850px}
  .hair{animation:sway 1.2s ease-in-out infinite alternate;transform-origin:200px 150px}
  .eyes{animation:blink 4s infinite;transform-origin:200px 205px}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
  @keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
</style>
</head>
<body>
<div class="stage">
  <div class="half fuori"><svg viewBox="0 0 400 900"><use href="#ciuffo"/></svg></div>
  <div class="half dentro"><svg viewBox="0 0 400 900"><use href="#ciuffo"/></svg></div>
</div>

 </g>
</g>
</defs>
</svg>
</body>
</html>
